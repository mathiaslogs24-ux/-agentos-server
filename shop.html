<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#F0B429; --gold2:#FFD166; --dark:#0A0A0B; --bg1:#111113;
  --bg2:#18181C; --bg3:#222228; --border:rgba(255,255,255,.08);
  --text:#F0EEE8; --t2:#A09C94; --t3:#5A5752;
  --green:#4ADE80; --red:#F87171; --purple:#C084FC;
  --r:16px; --rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;}

/* HEADER */
.header{flex-shrink:0;background:var(--bg1);border-bottom:1px solid var(--border);padding:14px 16px 0;position:relative;z-index:10;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.store-name{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.store-name span{color:var(--gold);}
.cart-btn{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .15s;}
.cart-btn:active{transform:scale(.93);}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#000;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}

/* SEARCH */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-family:'Syne',sans-serif;font-size:14px;flex:1;}
.search-bar input::placeholder{color:var(--t3);}

/* CATEGORIES */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bg2);color:var(--t2);white-space:nowrap;}
.cat-tab.active{background:var(--gold);color:#000;border-color:var(--gold);}
.cat-tab:active{transform:scale(.95);}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}

/* GRID */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;}
.prod-card:active{transform:scale(.97);}
.prod-card.out{opacity:.5;pointer-events:none;}
.prod-card-top{height:120px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;}
.prod-badge{position:absolute;top:8px;left:8px;background:rgba(192,132,252,.15);border:1px solid rgba(192,132,252,.3);border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;color:var(--purple);font-family:'DM Mono';}
.stock-badge{position:absolute;top:8px;right:8px;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;font-family:'DM Mono';}
.stock-badge.ok{background:rgba(74,222,128,.15);color:var(--green);}
.stock-badge.low{background:rgba(251,146,60,.15);color:#FB923C;}
.stock-badge.out{background:rgba(248,113,113,.12);color:var(--red);}
.prod-card-body{padding:10px 12px 12px;}
.prod-cat{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.prod-name{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:8px;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-size:16px;font-weight:800;}
.add-btn{width:28px;height:28px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;transition:all .15s;flex-shrink:0;}
.add-btn:active{transform:scale(.9);}
.add-btn.in-cart{background:var(--bg3);color:var(--gold);border:1px solid rgba(240,180,41,.4);font-size:12px;}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.empty-icon{font-size:48px;opacity:.4;}
.empty-title{font-size:16px;font-weight:700;color:var(--t2);}
.empty-sub{font-size:13px;color:var(--t3);}

/* SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px);}
.sheet-overlay.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:51;background:var(--bg1);border-radius:24px 24px 0 0;border-top:1px solid var(--border);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90dvh;max-height:90vh;overflow-y:auto;padding-bottom:20px;}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:12px auto 20px;}
.sheet-img{height:160px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:72px;margin:0 16px;border-radius:var(--r);border:1px solid var(--border);}
.sheet-body{padding:20px 16px 0;}
.sheet-cat{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.sheet-name{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:10px;}
.sheet-meta{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.sheet-tag{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--border);}
.sheet-tag.purple{color:var(--purple);border-color:rgba(192,132,252,.25);}
.sheet-tag.green{color:var(--green);border-color:rgba(74,222,128,.25);}
.sheet-price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.sheet-price{font-size:28px;font-weight:800;}
.sheet-price small{font-size:14px;color:var(--t3);font-weight:400;}
.qty-ctrl{display:flex;align-items:center;gap:12px;}
.qty-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .15s;}
.qty-btn:active{transform:scale(.9);}
.qty-num{font-size:18px;font-weight:800;min-width:24px;text-align:center;}
.sheet-add-btn{width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#000;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .15s;}
.sheet-add-btn:active{transform:scale(.98);opacity:.9;}
.sheet-add-btn:disabled{background:var(--bg3);color:var(--t3);cursor:not-allowed;transform:none;}

/* CART */
.cart-title-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px;}
.cart-title{font-size:20px;font-weight:800;}
.clear-cart{font-size:12px;color:var(--red);cursor:pointer;font-weight:600;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
.cart-item-icon{width:44px;height:44px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cart-item-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.cart-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.cart-item-price{font-size:14px;font-weight:800;color:var(--gold);}
.cart-item-qty{display:flex;align-items:center;gap:8px;}
.cq-btn{width:26px;height:26px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;}
.cq-btn:active{background:var(--bg2);}
.cq-num{font-size:13px;font-weight:700;min-width:16px;text-align:center;}
.cart-summary{padding:16px;}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
.cart-row .label{font-size:13px;color:var(--t2);}
.cart-row .val{font-size:13px;font-weight:700;}
.cart-row.total .label{font-size:16px;font-weight:700;color:var(--text);}
.cart-row.total .val{font-size:20px;font-weight:800;color:var(--gold);}
.cart-sep{height:1px;background:var(--border);margin:8px 0;}
.order-btn{width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#000;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.order-btn:active{transform:scale(.98);}
.order-btn:disabled{background:var(--bg3);color:var(--t3);cursor:not-allowed;transform:none;}
.order-btn.loading{opacity:.7;pointer-events:none;}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--bg3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--t2);font-weight:600;}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.32,.72,0,1);white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}

.main::-webkit-scrollbar{width:3px;}
.main::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px;}
.sheet::-webkit-scrollbar{width:3px;}
.sheet::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px;}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="store-name">💨 <span>Vape</span>Shop</div>
      <div class="cart-btn" onclick="openCart()">
        🛒<div class="cart-badge" id="cartBadge">0</div>
      </div>
    </div>
    <div class="search-bar">
      <span style="color:var(--t3);">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher un parfum…" oninput="onSearch(this.value)">
    </div>
    <div class="cats" id="catsBar"></div>
  </div>

  <div class="main" id="mainArea">
    <div class="loading" id="loadingEl">
      <div class="spinner"></div>
      <div class="loading-text">Chargement du catalogue…</div>
    </div>
    <div class="products-grid" id="productsGrid" style="display:none;"></div>
    <div class="empty" id="emptyEl" style="display:none;">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">Aucun produit trouvé</div>
      <div class="empty-sub">Essayez un autre terme</div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="sheet-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-img" id="detailImg">💨</div>
  <div class="sheet-body">
    <div class="sheet-cat" id="detailCat"></div>
    <div class="sheet-name" id="detailName"></div>
    <div class="sheet-meta" id="detailMeta"></div>
    <div class="sheet-price-row">
      <div class="sheet-price" id="detailPrice"></div>
      <div class="qty-ctrl">
        <div class="qty-btn" onclick="changeDetailQty(-1)">−</div>
        <div class="qty-num" id="detailQtyNum">1</div>
        <div class="qty-btn" onclick="changeDetailQty(1)">+</div>
      </div>
    </div>
    <button class="sheet-add-btn" id="detailAddBtn" onclick="addToCartFromDetail()">Ajouter au panier</button>
  </div>
</div>

<!-- CART SHEET -->
<div class="sheet-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="sheet" id="cartSheet">
  <div class="sheet-handle"></div>
  <div class="cart-title-row">
    <div class="cart-title">Mon Panier 🛒</div>
    <div class="clear-cart" onclick="clearCart()">Vider</div>
  </div>
  <div id="cartItems"></div>
  <div class="cart-summary" id="cartSummary"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════
const SERVER = 'https://agentos-server-production-a5b4.up.railway.app';

// Emoji par parfum / mot-clé
function getEmoji(name) {
  const n = name.toLowerCase();
  if(n.includes('blue') || n.includes('ice') || n.includes('mint') || n.includes('frais')) return '🫐';
  if(n.includes('cherry') || n.includes('cerise')) return '🍒';
  if(n.includes('strawberry') || n.includes('fraise')) return '🍓';
  if(n.includes('mango') || n.includes('mangue')) return '🥭';
  if(n.includes('watermelon') || n.includes('pastèque')) return '🍉';
  if(n.includes('passion') || n.includes('kiwi')) return '🥝';
  if(n.includes('raspberry') || n.includes('framboise')) return '🍇';
  if(n.includes('blueberry') || n.includes('myrtille')) return '🫐';
  if(n.includes('peach') || n.includes('pêche')) return '🍑';
  if(n.includes('lemon') || n.includes('citron')) return '🍋';
  if(n.includes('grape') || n.includes('raisin')) return '🍇';
  if(n.includes('mixed') || n.includes('skittles') || n.includes('berry')) return '🍬';
  if(n.includes('cola') || n.includes('energy')) return '⚡';
  if(n.includes('tobacco') || n.includes('tabac')) return '🍂';
  return '💨';
}

// Telegram
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#111113'); tg.setBackgroundColor('#0A0A0B'); }

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let products = [];
let cart = {};
let activeCat = 'all';
let searchQuery = '';
let detailProduct = null;
let detailQty = 1;

// ═══════════════════════════════════════
//  INIT — charge le stock depuis Railway
// ═══════════════════════════════════════
async function init() {
  try {
    const res = await fetch(SERVER + '/stock-public');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    products = (Array.isArray(data) ? data : data.stock || [])
      .filter(p => p.qty > 0)
      .map(p => ({
        id   : p.id,
        name : p.name,
        cat  : p.cat || 'Autre',
        price: parseFloat(p.price || 0),
        qty  : parseInt(p.qty || 0),
        puffs: parseInt(p.puffs || 0),
        alert: parseInt(p.alert || 5),
        emoji: getEmoji(p.name),
      }));
  } catch(e) {
    console.warn('Fallback demo:', e);
    // Démo si API unreachable
    products = [
      {id:1,name:'Blue Rice Ice',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5,emoji:'🫐'},
      {id:2,name:'Cherry Berry',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5,emoji:'🍒'},
      {id:3,name:'Blueberry Raspberry',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5,emoji:'🍇'},
      {id:4,name:'Mixed Berries',cat:'JNR 2%',price:15,qty:30,puffs:18000,alert:5,emoji:'🍬'},
      {id:5,name:'Passion Fruit Kiwi',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5,emoji:'🥝'},
      {id:6,name:'Skittles',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5,emoji:'🍬'},
    ];
  }
  renderCats();
  renderProducts();
}

// ═══════════════════════════════════════
//  CATEGORIES
// ═══════════════════════════════════════
function renderCats() {
  const cats = ['all', ...new Set(products.map(p => p.cat))];
  document.getElementById('catsBar').innerHTML = cats.map(c =>
    `<div class="cat-tab ${c===activeCat?'active':''}" onclick="setCat('${c}')">
      ${c==='all'?'🛍 Tous':c}
    </div>`
  ).join('');
}

function setCat(cat) {
  activeCat = cat;
  renderCats();
  renderProducts();
}

// ═══════════════════════════════════════
//  PRODUCTS
// ═══════════════════════════════════════
function getFiltered() {
  return products.filter(p => {
    const mc = activeCat==='all' || p.cat===activeCat;
    const ms = !searchQuery || p.name.toLowerCase().includes(searchQuery) || p.cat.toLowerCase().includes(searchQuery);
    return mc && ms;
  });
}

function fmtPuffs(p) { return p>=1000?(p/1000).toFixed(0)+'K':p+''; }

function renderProducts() {
  document.getElementById('loadingEl').style.display = 'none';
  const filtered = getFiltered();
  const grid = document.getElementById('productsGrid');
  const empty = document.getElementById('emptyEl');
  if(!filtered.length){ grid.style.display='none'; empty.style.display='flex'; return; }
  empty.style.display='none'; grid.style.display='grid';

  grid.innerHTML = filtered.map(p => {
    const inCart = cart[p.id]?.qty || 0;
    const ss = p.qty===0?'out':p.qty<=p.alert?'low':'ok';
    const sl = p.qty===0?'Rupture':p.qty<=p.alert?p.qty+' restants':p.qty+' dispo';
    return `<div class="prod-card ${p.qty===0?'out':''}" onclick="openDetail(${p.id})">
      <div class="prod-card-top">
        <span>${p.emoji}</span>
        ${p.puffs?`<div class="prod-badge">${fmtPuffs(p.puffs)} puffs</div>`:''}
        <div class="stock-badge ${ss}">${sl}</div>
      </div>
      <div class="prod-card-body">
        <div class="prod-cat">${p.cat}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-footer">
          <div class="prod-price">${p.price.toFixed(2)}€</div>
          <div class="add-btn ${inCart?'in-cart':''}" onclick="event.stopPropagation();quickAdd(${p.id})">
            ${inCart||'+'}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function onSearch(v){ searchQuery=v.toLowerCase(); renderProducts(); }

// ═══════════════════════════════════════
//  DETAIL
// ═══════════════════════════════════════
function openDetail(id) {
  detailProduct = products.find(p=>p.id===id);
  if(!detailProduct) return;
  detailQty = cart[id]?.qty || 1;
  document.getElementById('detailImg').innerHTML = `<span style="font-size:72px;">${detailProduct.emoji}</span>`;
  document.getElementById('detailCat').textContent = detailProduct.cat;
  document.getElementById('detailName').textContent = detailProduct.name;
  const meta = [];
  if(detailProduct.puffs) meta.push(`<div class="sheet-tag purple">💨 ${fmtPuffs(detailProduct.puffs)} puffs</div>`);
  if(detailProduct.qty>0) meta.push(`<div class="sheet-tag green">✓ ${detailProduct.qty} en stock</div>`);
  else meta.push(`<div class="sheet-tag" style="color:var(--red);">✕ Rupture</div>`);
  document.getElementById('detailMeta').innerHTML = meta.join('');
  const btn = document.getElementById('detailAddBtn');
  btn.disabled = detailProduct.qty===0;
  btn.textContent = detailProduct.qty===0?'Rupture de stock':'Ajouter au panier';
  updateDetailDisplay();
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailSheet').classList.add('open');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailSheet').classList.remove('open');
}

function updateDetailDisplay(){
  document.getElementById('detailQtyNum').textContent = detailQty;
  document.getElementById('detailPrice').innerHTML =
    `${(detailProduct.price*detailQty).toFixed(2)}<small>€</small>`;
}

function changeDetailQty(d){
  detailQty = Math.max(1,Math.min(detailProduct.qty,detailQty+d));
  updateDetailDisplay();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function addToCartFromDetail(){
  if(!detailProduct||detailProduct.qty===0) return;
  cart[detailProduct.id] = {product:detailProduct,qty:detailQty};
  closeDetail(); renderProducts(); updateCartBadge();
  showToast(`✓ ${detailProduct.name} ajouté`);
  if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function quickAdd(id){
  const p = products.find(x=>x.id===id);
  if(!p||p.qty===0) return;
  if(cart[id]) cart[id].qty = Math.min(p.qty,cart[id].qty+1);
  else cart[id]={product:p,qty:1};
  renderProducts(); updateCartBadge();
  showToast(`✓ ${p.name}`);
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
}

// ═══════════════════════════════════════
//  CART
// ═══════════════════════════════════════
function openCart(){ renderCart(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartSheet').classList.add('open'); }
function closeCart(){ document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartSheet').classList.remove('open'); }

function renderCart(){
  const items = Object.values(cart);
  const itemsEl = document.getElementById('cartItems');
  const sumEl = document.getElementById('cartSummary');
  if(!items.length){
    itemsEl.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><div class="empty-title">Panier vide</div><div class="empty-sub">Ajoutez des produits</div></div>';
    sumEl.innerHTML=''; return;
  }
  itemsEl.innerHTML = items.map(({product:p,qty}) =>
    `<div class="cart-item">
      <div class="cart-item-icon">${p.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-sub">${p.cat}${p.puffs?' · '+fmtPuffs(p.puffs)+' puffs':''}</div>
      </div>
      <div class="cart-item-right">
        <div class="cart-item-price">${(p.price*qty).toFixed(2)}€</div>
        <div class="cart-item-qty">
          <div class="cq-btn" onclick="cartQty(${p.id},-1)">−</div>
          <div class="cq-num">${qty}</div>
          <div class="cq-btn" onclick="cartQty(${p.id},1)">+</div>
        </div>
      </div>
    </div>`
  ).join('');

  const subtotal = items.reduce((s,{product:p,qty})=>s+p.price*qty,0);
  const nbItems = items.reduce((s,i)=>s+i.qty,0);
  sumEl.innerHTML = `
    <div class="cart-sep"></div>
    <div class="cart-row"><span class="label">${nbItems} article(s)</span><span class="val">${subtotal.toFixed(2)}€</span></div>
    <div class="cart-row total"><span class="label">Total</span><span class="val">${subtotal.toFixed(2)}€</span></div>
    <div style="height:14px;"></div>
    <button class="order-btn" id="orderBtn" onclick="placeOrder()">
      💳 Payer ${subtotal.toFixed(2)}€ par carte
    </button>
    <div style="height:6px;"></div>`;
}

function cartQty(id,d){
  if(!cart[id]) return;
  cart[id].qty = Math.max(0,Math.min(cart[id].product.qty,cart[id].qty+d));
  if(cart[id].qty===0) delete cart[id];
  renderCart(); renderProducts(); updateCartBadge();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function clearCart(){ cart={}; renderCart(); renderProducts(); updateCartBadge(); }

function updateCartBadge(){
  const n = Object.values(cart).reduce((s,i)=>s+i.qty,0);
  const b = document.getElementById('cartBadge');
  b.style.display = n>0?'flex':'none';
  b.textContent = n;
}

// ═══════════════════════════════════════
//  CHECKOUT → Stripe via Railway
// ═══════════════════════════════════════
async function placeOrder(){
  const items = Object.values(cart);
  if(!items.length) return;

  const btn = document.getElementById('orderBtn');
  btn.classList.add('loading');
  btn.textContent = '⏳ Création du paiement…';

  const user = tg?.initDataUnsafe?.user;
  const cartPayload = items.map(({product:p,qty}) => ({
    stockId    : p.id,
    title      : p.name,
    description: `${p.cat}${p.puffs?' · '+fmtPuffs(p.puffs)+' puffs':''}`,
    price      : (p.price * qty).toFixed(2),
    payload    : 'stock_' + p.id,
  }));

  try {
    const res = await fetch(SERVER + '/shop-checkout', {
      method : 'POST',
      headers: {'Content-Type':'application/json'},
      body   : JSON.stringify({
        cart    : cartPayload,
        userId  : user?.id   || '',
        userName: user?.username || user?.first_name || '',
      }),
    });
    const data = await res.json();
    if(!data.url) throw new Error(data.error || 'Erreur serveur');

    // Ouvrir Stripe dans le navigateur Telegram
    if(tg) tg.openLink(data.url);
    else window.open(data.url, '_blank');

    // Vider le panier + message
    cart = {};
    updateCartBadge();
    closeCart();
    showToast('✓ Redirection vers le paiement…');
    if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch(e) {
    showToast('⚠ ' + e.message);
    if(btn){ btn.classList.remove('loading'); btn.textContent = `💳 Réessayer`; }
  }
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

init();
</script>
</body>
</html>
