<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marketplace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#F0B429;--gold2:#FFD166;--dark:#0A0A0B;--bg1:#111113;--bg2:#18181C;--bg3:#222228;
  --border:rgba(255,255,255,.08);--text:#F0EEE8;--t2:#A09C94;--t3:#5A5752;
  --green:#4ADE80;--red:#F87171;--purple:#C084FC;--blue:#4FC3F7;
  --r:16px;--rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Syne',sans-serif;overflow:hidden;}
#app{display:flex;flex-direction:column;height:100dvh;}

/* ── HEADER */
.header{flex-shrink:0;background:var(--bg1);border-bottom:1px solid var(--border);padding:12px 16px 0;z-index:10;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.logo{font-size:17px;font-weight:800;letter-spacing:-.02em;}
.logo span{color:var(--gold);}
.cart-btn{position:relative;background:var(--bg3);border:1px solid var(--border);border-radius:12px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;}
.cart-btn:active{transform:scale(.93);}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#000;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}

/* ── SEARCH */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 13px;margin-bottom:10px;}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;flex:1;}
.search-bar input::placeholder{color:var(--t3);}

/* ── FILTER ROWS */
.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-row + .filter-row{padding-top:2px;}
.filter-label{flex-shrink:0;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);display:flex;align-items:center;padding:0 2px;}
.chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bg2);color:var(--t2);white-space:nowrap;}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);}
.chip.active-purple{background:rgba(192,132,252,.2);color:var(--purple);border-color:rgba(192,132,252,.4);}
.chip.active-blue{background:rgba(79,195,247,.15);color:var(--blue);border-color:rgba(79,195,247,.3);}
.chip:active{transform:scale(.95);}

/* ── MAIN */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── SELLER SECTION */
.seller-section{padding:14px 14px 0;}
.seller-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;}
.seller-avatar{width:38px;height:38px;border-radius:11px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#000;flex-shrink:0;}
.seller-info{flex:1;min-width:0;}
.seller-name{font-size:13px;font-weight:800;}
.seller-desc{font-size:10px;color:var(--t3);margin-top:2px;}
.seller-badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.2);flex-shrink:0;}

/* ── PRODUCT GRID */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px;}
.prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;position:relative;}
.prod-card:active{transform:scale(.97);}
.prod-card.out-of-stock{opacity:.45;pointer-events:none;}

.prod-top{height:115px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:50px;position:relative;}
.puffs-badge{position:absolute;top:7px;left:7px;background:rgba(192,132,252,.18);border:1px solid rgba(192,132,252,.35);border-radius:5px;padding:2px 6px;font-size:9px;font-weight:700;color:var(--purple);font-family:'DM Mono';letter-spacing:.02em;}
.stock-badge{position:absolute;top:7px;right:7px;border-radius:5px;padding:2px 6px;font-size:9px;font-weight:700;font-family:'DM Mono';}
.stock-badge.ok{background:rgba(74,222,128,.15);color:var(--green);}
.stock-badge.low{background:rgba(251,146,60,.18);color:#FB923C;}
.stock-badge.out{background:rgba(248,113,113,.12);color:var(--red);}
.seller-mini{position:absolute;bottom:6px;left:7px;font-size:9px;font-weight:700;color:rgba(255,255,255,.35);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;backdrop-filter:blur(4px);}

.prod-body{padding:9px 11px 11px;}
.prod-brand{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin-bottom:2px;}
.prod-name{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:7px;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-size:15px;font-weight:800;}
.add-btn{width:28px;height:28px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#000;flex-shrink:0;transition:all .15s;}
.add-btn:active{transform:scale(.88);}
.add-btn.in-cart{background:rgba(240,180,41,.15);color:var(--gold);border:1.5px solid rgba(240,180,41,.4);font-size:11px;font-weight:800;}

/* ── EMPTY */
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.empty-icon{font-size:44px;opacity:.35;}
.empty-title{font-size:15px;font-weight:700;color:var(--t2);}
.empty-sub{font-size:12px;color:var(--t3);}

/* ── SHEETS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(5px);}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:51;background:var(--bg1);border-radius:24px 24px 0 0;border-top:1px solid var(--border);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;padding-bottom:20px;}
.sheet.open{transform:translateY(0);}
.drag-handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:11px auto 18px;}

/* ── DETAIL */
.det-img{height:160px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:68px;margin:0 16px;border-radius:var(--r);border:1px solid var(--border);}
.det-body{padding:18px 16px 0;}
.det-seller{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.det-brand{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.det-name{font-size:21px;font-weight:800;line-height:1.2;margin-bottom:12px;}
.det-tags{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.dtag{padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--bg2);}
.dtag.purple{color:var(--purple);border-color:rgba(192,132,252,.3);}
.dtag.green{color:var(--green);border-color:rgba(74,222,128,.3);}
.dtag.gold{color:var(--gold);border-color:rgba(240,180,41,.3);}
.dtag.blue{color:var(--blue);border-color:rgba(79,195,247,.3);}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.big-price{font-size:28px;font-weight:800;}
.big-price small{font-size:13px;color:var(--t3);font-weight:400;}
.qty-ctrl{display:flex;align-items:center;gap:14px;}
.qty-btn{width:36px;height:36px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .15s;}
.qty-btn:active{transform:scale(.88);}
.qty-num{font-size:18px;font-weight:800;min-width:24px;text-align:center;}
.add-main{width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#000;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .15s;}
.add-main:active{transform:scale(.98);opacity:.9;}
.add-main:disabled{background:var(--bg3);color:var(--t3);cursor:not-allowed;transform:none;}

/* ── CART */
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;}
.cart-hd-title{font-size:19px;font-weight:800;}
.cart-clear{font-size:12px;color:var(--red);cursor:pointer;font-weight:600;}
.ci{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border);}
.ci-ic{width:44px;height:44px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.ci-inf{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-sub{font-size:10px;color:var(--t3);margin-top:2px;}
.ci-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.ci-price{font-size:13px;font-weight:800;color:var(--gold);}
.ci-qty{display:flex;align-items:center;gap:7px;}
.cqb{width:25px;height:25px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
.cqb:active{background:var(--bg2);}
.cqn{font-size:12px;font-weight:700;min-width:14px;text-align:center;}
.cart-sum{padding:14px 16px;}
.cr{display:flex;justify-content:space-between;padding:5px 0;}
.cr .l{font-size:12px;color:var(--t2);}
.cr .v{font-size:12px;font-weight:700;}
.cr.tot .l{font-size:15px;font-weight:800;color:var(--text);}
.cr.tot .v{font-size:20px;font-weight:800;color:var(--gold);}
.csep{height:1px;background:var(--border);margin:8px 0;}
.pay-btn{width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#000;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.pay-btn:active{transform:scale(.98);}
.pay-btn:disabled{background:var(--bg3);color:var(--t3);cursor:not-allowed;transform:none;}

/* ── LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--bg3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.32,.72,0,1);white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.toast.show{transform:translateX(-50%) translateY(0);}
.main::-webkit-scrollbar,.sheet::-webkit-scrollbar{width:3px;}
.main::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb{background:var(--bg3);}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">🛍 <span>Marketplace</span></div>
      <div class="cart-btn" onclick="openCart()">🛒<div class="cart-badge" id="cartBadge">0</div></div>
    </div>
    <div class="search-bar">
      <span style="color:var(--t3);font-size:15px;">🔍</span>
      <input type="text" id="searchInput" placeholder="Rechercher parfum, marque…" oninput="onSearch(this.value)">
    </div>
    <!-- Ligne 1 : Vendeurs -->
    <div class="filter-row" id="sellerRow"></div>
    <!-- Ligne 2 : Marque / Catégorie -->
    <div class="filter-row" id="brandRow"></div>
    <!-- Ligne 3 : Puffs -->
    <div class="filter-row" id="puffsRow"></div>
  </div>

  <div class="main" id="mainArea">
    <div class="loading" id="loadingEl">
      <div class="spinner"></div>
      <div style="font-size:13px;color:var(--t2);font-weight:600;">Chargement…</div>
    </div>
    <div id="marketContent" style="display:none;"></div>
    <div class="empty" id="emptyEl" style="display:none;">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">Aucun produit</div>
      <div class="empty-sub">Essayez d'autres filtres</div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="overlay" id="detailOv" onclick="closeDetail()"></div>
<div class="sheet" id="detailSh">
  <div class="drag-handle"></div>
  <div class="det-img" id="dImg"></div>
  <div class="det-body">
    <div class="det-seller" id="dSeller"></div>
    <div class="det-brand" id="dBrand"></div>
    <div class="det-name" id="dName"></div>
    <div class="det-tags" id="dTags"></div>
    <div class="price-row">
      <div class="big-price" id="dPrice"></div>
      <div class="qty-ctrl">
        <div class="qty-btn" onclick="changeQty(-1)">−</div>
        <div class="qty-num" id="dQty">1</div>
        <div class="qty-btn" onclick="changeQty(1)">+</div>
      </div>
    </div>
    <button class="add-main" id="dAddBtn" onclick="addFromDetail()">Ajouter au panier</button>
  </div>
</div>

<!-- CART SHEET -->
<div class="overlay" id="cartOv" onclick="closeCart()"></div>
<div class="sheet" id="cartSh">
  <div class="drag-handle"></div>
  <div class="cart-hd">
    <div class="cart-hd-title">Panier 🛒</div>
    <div class="cart-clear" onclick="clearCart()">Vider</div>
  </div>
  <div id="cartItems"></div>
  <div class="cart-sum" id="cartSum"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVER = 'https://agentos-server-production-a5b4.up.railway.app';
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#111113'); tg.setBackgroundColor('#0A0A0B'); }

// ── STATE
let sellersData  = [];
let allProducts  = [];
let cart         = {};
let filterSeller = 'all';
let filterBrand  = 'all';
let filterPuffs  = 'all';
let searchQ      = '';
let detailP      = null;
let detailQty    = 1;

// ── EMOJI
function emoji(name=''){
  const n=name.toLowerCase();
  if(n.includes('blue')||n.includes('myrt')||n.includes('blueberry'))return'🫐';
  if(n.includes('cherry')||n.includes('cerise'))return'🍒';
  if(n.includes('strawberry')||n.includes('fraise'))return'🍓';
  if(n.includes('mango')||n.includes('mangue'))return'🥭';
  if(n.includes('watermelon')||n.includes('past'))return'🍉';
  if(n.includes('passion')||n.includes('kiwi'))return'🥝';
  if(n.includes('raspberry')||n.includes('framb'))return'🍇';
  if(n.includes('peach')||n.includes('pêche'))return'🍑';
  if(n.includes('lemon')||n.includes('citron'))return'🍋';
  if(n.includes('skittles')||n.includes('mixed')||n.includes('candy'))return'🍬';
  if(n.includes('cola')||n.includes('energy'))return'⚡';
  if(n.includes('grape')||n.includes('raisin'))return'🍇';
  if(n.includes('mint')||n.includes('menthe')||n.includes('ice'))return'❄️';
  if(n.includes('tobacco')||n.includes('tabac'))return'🍂';
  if(n.includes('vanilla')||n.includes('vanille'))return'🍦';
  return'💨';
}

function fmtPuffs(p){ return p>=1000?(p/1000).toFixed(0)+'K':p+''; }
function cKey(p){ return p.sellerId+'_'+p.id; }

// ── BRAND extraction from cat field (ex: "JNR 2%" → "JNR")
function extractBrand(cat){ return (cat||'').split(' ')[0]||'Autre'; }

// PUFFS — valeur exacte arrondie au K
function puffsBucket(p){
  if(!p||p===0) return 'other';
  return fmtPuffs(p); // ex: 18000 → "18K", 9000 → "9K"
}

// ── INIT
async function init(){
  try{
    const res = await fetch(SERVER+'/marketplace');
    if(!res.ok) throw new Error();
    sellersData = await res.json();
    allProducts = sellersData.flatMap(s=>s.items.map(p=>({...p,emoji:emoji(p.title)})));
  }catch(e){
    sellersData=[{
      sellerId:'admin',sellerName:'Boutique Officielle',sellerShop:'Boutique Officielle',
      items:[
        {id:1,sellerId:'admin',sellerName:'Boutique Officielle',title:'Blue Rice Ice',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5},
        {id:2,sellerId:'admin',sellerName:'Boutique Officielle',title:'Cherry Berry',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5},
        {id:3,sellerId:'admin',sellerName:'Boutique Officielle',title:'Mixed Berries',cat:'JNR 2%',price:15,qty:30,puffs:18000,alert:5},
        {id:4,sellerId:'admin',sellerName:'Boutique Officielle',title:'Passion Fruit Kiwi',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5},
        {id:5,sellerId:'admin',sellerName:'Boutique Officielle',title:'Skittles',cat:'JNR 2%',price:15,qty:8,puffs:18000,alert:5},
        {id:6,sellerId:'admin',sellerName:'Boutique Officielle',title:'Blueberry Raspberry',cat:'JNR 2%',price:15,qty:10,puffs:18000,alert:5},
      ]
    }];
    allProducts=sellersData.flatMap(s=>s.items.map(p=>({...p,emoji:emoji(p.title)})));
  }
  buildFilters();
  renderMarket();
}

// ── BUILD FILTER CHIPS
function buildFilters(){
  // Vendeurs
  const sellerOpts = [{id:'all',label:'🛍 Tous les vendeurs'},...sellersData.map(s=>({id:String(s.sellerId),label:s.sellerShop||s.sellerName}))];
  document.getElementById('sellerRow').innerHTML = sellerOpts.map(o=>
    '<div class="chip '+(filterSeller===o.id?'active':'')+'" onclick="setFilter(\'seller\',\''+o.id+'\')">'+o.label+'</div>'
  ).join('');

  // Marques (depuis cat field)
  const brands = ['all',...new Set(allProducts.map(p=>extractBrand(p.cat)).filter(Boolean))];
  document.getElementById('brandRow').innerHTML =
    '<span class="filter-label">Marque</span>' +
    brands.map(b=>
      '<div class="chip '+(filterBrand===b?(b==='all'?'active':'active-purple'):'')+'" onclick="setFilter(\'brand\',\''+b+'\')">'+(b==='all'?'Toutes':b)+'</div>'
    ).join('');

  // Puffs buckets
  const puffVals = [...new Set(allProducts.map(p=>puffsBucket(p.puffs)))].sort((a,b)=>{
    const order=['5K','10K','15K','20K','20K+','other'];
    return order.indexOf(a)-order.indexOf(b);
  });
  const puffOpts = [{id:'all',label:'Tous'},...puffVals.filter(v=>v!=='other').map(v=>({id:v,label:'💨 '+v}))].sort((a,b)=>{
    if(a.id==='all') return -1; if(b.id==='all') return 1;
    return parseInt(a.id)*1000 - parseInt(b.id)*1000;
  });
  document.getElementById('puffsRow').innerHTML =
    '<span class="filter-label">Puffs</span>' +
    puffOpts.map(o=>
      '<div class="chip '+(filterPuffs===o.id?(o.id==='all'?'active':'active-blue'):'')+'" onclick="setFilter(\'puffs\',\''+o.id+'\')">'+(o.id==='all'?'Tous':o.label)+'</div>'
    ).join('');
}

function setFilter(type,val){
  if(type==='seller') filterSeller=val;
  if(type==='brand')  filterBrand=val;
  if(type==='puffs')  filterPuffs=val;
  buildFilters();
  renderMarket();
}

function onSearch(v){ searchQ=v.toLowerCase(); renderMarket(); }

// ── FILTER PRODUCTS
function getFiltered(){
  return allProducts.filter(p=>{
    if(filterSeller!=='all' && String(p.sellerId)!==filterSeller) return false;
    if(filterBrand!=='all'  && extractBrand(p.cat)!==filterBrand)  return false;
    if(filterPuffs!=='all'  && puffsBucket(p.puffs)!==filterPuffs) return false;
    if(searchQ && !p.title.toLowerCase().includes(searchQ) && !(p.cat||'').toLowerCase().includes(searchQ)) return false;
    return true;
  });
}

// ── RENDER
function renderMarket(){
  document.getElementById('loadingEl').style.display='none';
  const content = document.getElementById('marketContent');
  const empty   = document.getElementById('emptyEl');
  const filtered = getFiltered();

  if(!filtered.length){ content.style.display='none'; empty.style.display='flex'; return; }
  empty.style.display='none'; content.style.display='block';

  // Grouper par vendeur
  const bySeller={};
  filtered.forEach(p=>{
    const sid=String(p.sellerId);
    if(!bySeller[sid]) bySeller[sid]={name:p.sellerName,shop:p.sellerShop||p.sellerName,items:[]};
    bySeller[sid].items.push(p);
  });

  let html='';
  Object.values(bySeller).forEach(s=>{
    html+='<div class="seller-section">';
    // Header vendeur (masqué si un seul vendeur)
    if(Object.keys(bySeller).length>1){
      html+='<div class="seller-header">'
        +'<div class="seller-avatar">'+(s.shop?.[0]||'?')+'</div>'
        +'<div class="seller-info"><div class="seller-name">'+s.shop+'</div>'
        +'<div class="seller-desc">'+s.items.length+' article(s) disponible(s)</div></div>'
        +'<div class="seller-badge">✓ Vérifié</div></div>';
    }
    html+='<div class="products-grid">';
    s.items.forEach(p=>{
      const k=cKey(p);
      const inCart=cart[k]?.qty||0;
      const ss=p.qty<=0?'out':p.qty<=(p.alert||5)?'low':'ok';
      const sl=p.qty<=0?'Rupture':p.qty<=(p.alert||5)?p.qty+' restants':p.qty+' dispo';
      const brand=extractBrand(p.cat);
      const nicotine=(p.cat||'').replace(brand,'').trim()||'';
      html+='<div class="prod-card'+(p.qty<=0?' out-of-stock':'')+'" onclick="openDetail('+p.id+',\''+p.sellerId+'\')">'
        +'<div class="prod-top">'
        +'<span>'+(p.emoji||'💨')+'</span>'
        +(p.puffs?'<div class="puffs-badge">'+fmtPuffs(p.puffs)+' puffs</div>':'')
        +'<div class="stock-badge '+ss+'">'+sl+'</div>'
        +(Object.keys(bySeller).length>1?'<div class="seller-mini">'+s.shop+'</div>':'')
        +'</div>'
        +'<div class="prod-body">'
        +'<div class="prod-brand">'+brand+(nicotine?' · '+nicotine:'')+'</div>'
        +'<div class="prod-name">'+p.title+'</div>'
        +'<div class="prod-footer">'
        +'<div class="prod-price">'+parseFloat(p.price).toFixed(2)+'€</div>'
        +'<div class="add-btn'+(inCart?' in-cart':'')+'" onclick="event.stopPropagation();quickAdd('+p.id+',\''+p.sellerId+'\')">'+(inCart||'+')+'</div>'
        +'</div></div></div>';
    });
    html+='</div></div>';
  });
  content.innerHTML=html;
}

// ── DETAIL
function openDetail(id,sellerId){
  const p=allProducts.find(x=>x.id===id&&String(x.sellerId)===String(sellerId));
  if(!p) return;
  detailP=p; detailQty=cart[cKey(p)]?.qty||1;
  document.getElementById('dImg').innerHTML='<span style="font-size:70px;">'+(p.emoji||'💨')+'</span>';
  document.getElementById('dSeller').textContent='Vendu par '+p.sellerName;
  document.getElementById('dBrand').textContent=p.cat||'';
  document.getElementById('dName').textContent=p.title;

  const brand=extractBrand(p.cat);
  const nicotine=(p.cat||'').replace(brand,'').trim();
  let tags='';
  if(p.puffs) tags+='<div class="dtag purple">💨 '+fmtPuffs(p.puffs)+' puffs</div>';
  if(brand)   tags+='<div class="dtag gold">🏷 '+brand+'</div>';
  if(nicotine) tags+='<div class="dtag blue">🧪 '+nicotine+'</div>';
  if(p.qty>0) tags+='<div class="dtag green">✓ '+p.qty+' en stock</div>';
  else        tags+='<div class="dtag" style="color:var(--red);border-color:rgba(248,113,113,.3);">✕ Rupture</div>';
  document.getElementById('dTags').innerHTML=tags;

  const btn=document.getElementById('dAddBtn');
  btn.disabled=p.qty<=0; btn.textContent=p.qty<=0?'Rupture de stock':'Ajouter au panier';
  updateDetDisplay();
  document.getElementById('detailOv').classList.add('open');
  document.getElementById('detailSh').classList.add('open');
}
function closeDetail(){ document.getElementById('detailOv').classList.remove('open'); document.getElementById('detailSh').classList.remove('open'); }
function updateDetDisplay(){
  document.getElementById('dQty').textContent=detailQty;
  document.getElementById('dPrice').innerHTML=(detailP.price*detailQty).toFixed(2)+'<small>€</small>';
}
function changeQty(d){
  detailQty=Math.max(1,Math.min(detailP.qty,detailQty+d));
  updateDetDisplay();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
function addFromDetail(){
  if(!detailP||detailP.qty<=0) return;
  cart[cKey(detailP)]={product:detailP,qty:detailQty};
  closeDetail(); renderMarket(); updateBadge();
  showToast('✓ '+detailP.title+' ajouté');
  if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}
function quickAdd(id,sellerId){
  const p=allProducts.find(x=>x.id===id&&String(x.sellerId)===String(sellerId));
  if(!p||p.qty<=0) return;
  const k=cKey(p);
  if(cart[k]) cart[k].qty=Math.min(p.qty,cart[k].qty+1); else cart[k]={product:p,qty:1};
  renderMarket(); updateBadge(); showToast('✓ '+p.title);
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
}

// ── CART
function openCart(){ renderCart(); document.getElementById('cartOv').classList.add('open'); document.getElementById('cartSh').classList.add('open'); }
function closeCart(){ document.getElementById('cartOv').classList.remove('open'); document.getElementById('cartSh').classList.remove('open'); }
function clearCart(){ cart={}; renderCart(); renderMarket(); updateBadge(); }
function updateBadge(){
  const n=Object.values(cart).reduce((s,i)=>s+i.qty,0);
  const b=document.getElementById('cartBadge');
  b.style.display=n>0?'flex':'none'; b.textContent=n;
}
function renderCart(){
  const items=Object.values(cart);
  const iEl=document.getElementById('cartItems');
  const sEl=document.getElementById('cartSum');
  if(!items.length){
    iEl.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><div class="empty-title">Panier vide</div><div class="empty-sub">Ajoutez des produits</div></div>';
    sEl.innerHTML=''; return;
  }
  // Grouper par vendeur
  const bySeller={};
  items.forEach(({product:p,qty})=>{
    const sid=String(p.sellerId);
    if(!bySeller[sid]) bySeller[sid]={name:p.sellerName||'Boutique',items:[]};
    bySeller[sid].items.push({p,qty});
  });
  let html='';
  Object.values(bySeller).forEach(s=>{
    if(Object.keys(bySeller).length>1) html+='<div style="padding:8px 16px 2px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);">'+s.name+'</div>';
    s.items.forEach(({p,qty})=>{
      const k=cKey(p);
      html+='<div class="ci">'
        +'<div class="ci-ic">'+(p.emoji||'💨')+'</div>'
        +'<div class="ci-inf"><div class="ci-name">'+p.title+'</div>'
        +'<div class="ci-sub">'+(p.cat||'')+(p.puffs?' · '+fmtPuffs(p.puffs)+' puffs':'')+'</div></div>'
        +'<div class="ci-r"><div class="ci-price">'+(p.price*qty).toFixed(2)+'€</div>'
        +'<div class="ci-qty"><div class="cqb" onclick="cqty(\''+k+'\',-1)">−</div><div class="cqn">'+qty+'</div><div class="cqb" onclick="cqty(\''+k+'\',1)">+</div></div>'
        +'</div></div>';
    });
  });
  iEl.innerHTML=html;
  const subtotal=items.reduce((s,{product:p,qty})=>s+p.price*qty,0);
  const nb=items.reduce((s,i)=>s+i.qty,0);
  sEl.innerHTML='<div class="csep"></div>'
    +'<div class="cr"><span class="l">'+nb+' article(s)</span><span class="v">'+subtotal.toFixed(2)+'€</span></div>'
    +'<div style="height:12px;"></div>'
    +'<button class="pay-btn" id="payBtn" onclick="placeOrder()">💳 Payer '+subtotal.toFixed(2)+'€</button>'
    +'<div style="height:6px;"></div>';
}
function cqty(k,d){
  if(!cart[k]) return;
  cart[k].qty=Math.max(0,Math.min(cart[k].product.qty,cart[k].qty+d));
  if(cart[k].qty===0) delete cart[k];
  renderCart(); renderMarket(); updateBadge();
  if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

// ── CHECKOUT
async function placeOrder(){
  const items=Object.values(cart);
  if(!items.length) return;
  const btn=document.getElementById('payBtn');
  btn.disabled=true; btn.textContent='⏳ Création…';
  const user=tg?.initDataUnsafe?.user;
  const cartPayload=items.map(({product:p,qty})=>({
    sellerId:p.sellerId, id:p.id,
    title:p.title,
    description:(p.cat||'')+(p.puffs?' · '+fmtPuffs(p.puffs)+' puffs':''),
    price:(p.price*qty).toFixed(2), qty,
    payload:'stock_'+p.id,
  }));
  try{
    const res=await fetch(SERVER+'/shop-checkout',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cart:cartPayload,userId:user?.id||'',userName:user?.username||user?.first_name||''}),
    });
    const data=await res.json();
    if(!data.url) throw new Error(data.error||'Erreur');
    if(tg) tg.openLink(data.url); else window.open(data.url,'_blank');
    cart={}; updateBadge(); closeCart(); showToast('✓ Redirection paiement…');
    if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }catch(e){
    showToast('⚠ '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='💳 Réessayer'; }
  }
}

// ── TOAST
let tt;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200);
}

init();
</script>
