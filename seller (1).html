<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Vendeur</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#F0B429;--dark:#0A0A0B;--bg1:#111113;--bg2:#18181C;--bg3:#222228;--border:rgba(255,255,255,.08);--text:#F0EEE8;--t2:#A09C94;--t3:#5A5752;--green:#4ADE80;--red:#F87171;--blue:#4FC3F7;--r:14px;--rs:8px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-logo{font-size:18px;font-weight:800;}
.topbar-logo span{color:var(--gold);}
.seller-info{display:flex;align-items:center;gap:10px;}
.seller-avatar{width:36px;height:36px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#000;}
.seller-name{font-size:14px;font-weight:700;}
.main{max-width:900px;margin:0 auto;padding:24px;}
.login-box{max-width:400px;margin:80px auto;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:32px;}
.login-title{font-size:22px;font-weight:800;margin-bottom:8px;}
.login-sub{font-size:13px;color:var(--t2);margin-bottom:24px;}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px;}
input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:11px 14px;border-radius:var(--rs);outline:none;margin-bottom:16px;}
input:focus{border-color:var(--gold);}
.btn{padding:11px 18px;border-radius:var(--rs);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bg2);color:var(--text);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--gold);color:#000;border-color:var(--gold);}
.btn.full{width:100%;}
.btn.danger{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.3);}
.section{margin-bottom:28px;}
.section-title{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:8px;}
.stat-val{font-size:24px;font-weight:800;}
.stat-val.gold{color:var(--gold);}
.stat-val.green{color:var(--green);}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;}
.card-body{padding:16px;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);padding:8px 12px;border-bottom:1px solid var(--border);}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
tr:last-child td{border:none;}
.tag{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;}
.tg{background:rgba(74,222,128,.12);color:var(--green);}
.tr{background:rgba(248,113,113,.12);color:var(--red);}
.tw{background:rgba(240,180,41,.12);color:var(--gold);}
.row-actions{display:flex;gap:6px;}
.mini-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--t2);}
.mini-btn:hover{color:var(--text);border-color:var(--gold);}
.toggle-sw{display:flex;align-items:center;gap:8px;cursor:pointer;}
.toggle-sw input{display:none;}
.toggle-track{width:36px;height:20px;background:var(--bg3);border-radius:10px;position:relative;transition:background .2s;}
.toggle-track.on{background:var(--gold);}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:8px;transition:transform .2s;}
.toggle-track.on .toggle-thumb{transform:translateX(16px);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid.c3{grid-template-columns:2fr 1fr 1fr;}
.actions-bar{display:flex;gap:8px;margin-bottom:20px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;z-index:200;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-box">
    <div class="login-title">🛍 Dashboard Vendeur</div>
    <div class="login-sub">Entrez votre clé secrète pour accéder à votre espace vendeur.</div>
    <label>Clé secrète</label>
    <input type="password" id="secretInput" placeholder="Votre clé secrète…" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn primary full" onclick="doLogin()">Connexion</button>
    <div id="loginError" style="color:var(--red);font-size:12px;margin-top:10px;display:none;">Clé incorrecte. Vérifiez avec l'administrateur.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView" style="display:none;">
  <div class="topbar">
    <div class="topbar-logo">🛍 <span>Vendor</span>OS</div>
    <div class="seller-info">
      <div class="seller-avatar" id="sellerAvatar">?</div>
      <div class="seller-name" id="sellerNameEl">—</div>
      <button class="btn" onclick="doLogout()" style="margin-left:8px;font-size:12px;padding:6px 12px;">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Solde disponible</div>
        <div class="stat-val gold" id="stBalance">0.00€</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ventes totales</div>
        <div class="stat-val green" id="stSales">0.00€</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Articles actifs</div>
        <div class="stat-val" id="stActive">0</div>
      </div>
    </div>

    <!-- STOCK -->
    <div class="section">
      <div class="section-title">📦 Mon Stock
        <button class="btn" onclick="addStockRow()" style="margin-left:auto;font-size:12px;padding:6px 12px;">+ Ajouter</button>
        <button class="btn primary" onclick="pushStock()" style="font-size:12px;padding:6px 14px;">🖥 Pousser</button>
      </div>
      <div class="card">
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Produit</th><th>Catégorie</th><th>Qté</th><th>Prix €</th><th>Puffs K</th><th>En vente</th><th></th></tr></thead>
            <tbody id="stockBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVER = 'https://agentos-server-production-a5b4.up.railway.app';
let sellerSecret = '';
let sellerData   = null;
let localStock   = [];
let nid = 1;

// ─── LOGIN
async function doLogin() {
  const secret = document.getElementById('secretInput').value.trim();
  if(!secret) return;
  try {
    const res = await fetch(SERVER+'/seller/me', { headers:{'x-secret':secret} });
    if(!res.ok) throw new Error();
    const data = await res.json();
    sellerSecret = secret;
    sellerData   = data;
    localStock   = data.stock || [];
    nid = localStock.length ? Math.max(...localStock.map(s=>s.id||0))+1 : 1;
    document.getElementById('loginView').style.display='none';
    document.getElementById('dashView').style.display='block';
    document.getElementById('sellerAvatar').textContent = data.shopName?.[0]||data.name?.[0]||'?';
    document.getElementById('sellerNameEl').textContent = data.shopName||data.name;
    document.getElementById('stBalance').textContent = parseFloat(data.balance||0).toFixed(2)+'€';
    document.getElementById('stSales').textContent   = parseFloat(data.totalSales||0).toFixed(2)+'€';
    renderStock();
  } catch(e) {
    document.getElementById('loginError').style.display='block';
  }
}

function doLogout() {
  sellerSecret=''; sellerData=null; localStock=[];
  document.getElementById('loginView').style.display='block';
  document.getElementById('dashView').style.display='none';
  document.getElementById('secretInput').value='';
  document.getElementById('loginError').style.display='none';
}

// ─── STOCK
function renderStock() {
  const active = localStock.filter(s=>s.enVente).length;
  document.getElementById('stActive').textContent = active;

  document.getElementById('stockBody').innerHTML = localStock.map((s,i) => `
    <tr>
      <td><input value="${s.name||''}" oninput="localStock[${i}].name=this.value"
        style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Syne';font-size:12px;padding:6px 10px;border-radius:6px;outline:none;width:100%;min-width:140px;"></td>
      <td><input value="${s.cat||''}" oninput="localStock[${i}].cat=this.value"
        style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Syne';font-size:12px;padding:6px 10px;border-radius:6px;outline:none;width:100%;max-width:100px;"></td>
      <td><input type="number" value="${s.qty||0}" oninput="localStock[${i}].qty=parseInt(this.value)||0"
        style="background:var(--bg2);border:1px solid var(--border);color:var(--gold);font-family:'DM Mono';font-size:14px;font-weight:700;padding:6px 8px;border-radius:6px;outline:none;width:70px;text-align:center;"></td>
      <td><input type="number" step="0.01" value="${s.price||0}" oninput="localStock[${i}].price=parseFloat(this.value)||0"
        style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono';font-size:12px;padding:6px 8px;border-radius:6px;outline:none;width:75px;"></td>
      <td><input type="number" value="${s.puffs?s.puffs/1000:''}" placeholder="18" oninput="localStock[${i}].puffs=(parseFloat(this.value)||0)*1000"
        style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono';font-size:12px;padding:6px 8px;border-radius:6px;outline:none;width:65px;"></td>
      <td>
        <div class="toggle-sw" onclick="toggleEnVente(${i})">
          <div class="toggle-track ${s.enVente?'on':''}">
            <div class="toggle-thumb"></div>
          </div>
          <span style="font-size:11px;color:${s.enVente?'var(--green)':'var(--t3)'};">${s.enVente?'Oui':'Non'}</span>
        </div>
      </td>
      <td><button class="mini-btn" style="color:var(--red);" onclick="delRow(${i})">✕</button></td>
    </tr>
  `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--t3);padding:24px;">Aucun article — cliquez sur "+ Ajouter"</td></tr>';
}

function addStockRow() {
  localStock.push({ id:nid++, name:'', cat:'', qty:0, price:0, puffs:0, enVente:false, alert:5 });
  renderStock();
}

function delRow(i) { localStock.splice(i,1); renderStock(); }
function toggleEnVente(i) { localStock[i].enVente=!localStock[i].enVente; renderStock(); }

async function pushStock() {
  try {
    // 1. Pousser le stock
    const r1 = await fetch(SERVER+'/seller/stock', {
      method:'POST', headers:{'Content-Type':'application/json','x-secret':sellerSecret},
      body:JSON.stringify(localStock),
    });
    if(!r1.ok) throw new Error('Stock push failed');

    // 2. Pousser le catalogue (articles en vente)
    const shopItems = localStock.filter(s=>s.enVente&&s.qty>0).map(s=>({
      title      : s.name,
      description: s.puffs?`${s.puffs>=1000?(s.puffs/1000).toFixed(0)+'K':s.puffs} puffs${s.cat?' · '+s.cat:''}`:(s.cat||''),
      price      : String(s.price||0),
      asset      : 'EUR',
      payload    : 'stock_'+s.id,
      stockId    : s.id,
    }));
    const r2 = await fetch(SERVER+'/seller/shop', {
      method:'POST', headers:{'Content-Type':'application/json','x-secret':sellerSecret},
      body:JSON.stringify(shopItems),
    });
    if(!r2.ok) throw new Error('Shop push failed');

    const active = shopItems.length;
    document.getElementById('stActive').textContent = active;
    showToast(`✓ Synchronisé · ${localStock.length} articles · ${active} en vente`);
  } catch(e) { showToast('⚠ '+e.message); }
}

// ─── TOAST
let tt;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),3000);
}
</script>
</body>
</html>
